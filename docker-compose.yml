services:
  mysql:
    image: mysql:8.0
    container_name: hansport-mysql
    environment:
      MYSQL_DATABASE: hansport_v2
      MYSQL_USER: hansport
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backups/hansport_v2_old_20260605_175155.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./hansport_v2be
    container_name: hansport-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/hansport_v2?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: hansport
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      JPA_DDL_AUTO: validate
      JPA_SHOW_SQL: "false"
      FLYWAY_ENABLED: "true"
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-false}
      SECURITY_LOG_LEVEL: INFO
      JWT_BASE64_SECRET: ${JWT_BASE64_SECRET:?set JWT_BASE64_SECRET}
      JWT_ACCESS_TOKEN_VALIDITY: 86400
      JWT_REFRESH_TOKEN_VALIDITY: 604800
      UPLOAD_FILE_BASE_PATH: /app/upload
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-unused-local-client}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-unused-local-secret}
      YOUR_EMAIL: ${YOUR_EMAIL:-noreply@example.invalid}
      YOUR_APP_PASSWORD: ${YOUR_APP_PASSWORD:-unused-local-password}
      SERVER_PORT: 8080
      FRONTEND_URL: http://localhost:5173
      CORS_ALLOW_LOCALHOST: "false"
      COOKIE_SECURE: "false"
      SEED_ENABLED: ${SEED_ENABLED:-false}
      SEED_REQUIRED_ENABLED: ${SEED_REQUIRED_ENABLED:-true}
      SEED_ADMIN_ENABLED: ${SEED_ADMIN_ENABLED:-false}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_SETTINGS_ENABLED: ${SEED_SETTINGS_ENABLED:-true}
      MANAGEMENT_ENDPOINTS: health,info
      MANAGEMENT_HEALTH_MAIL_ENABLED: ${MANAGEMENT_HEALTH_MAIL_ENABLED:-false}
    ports:
      - "8080:8080"
    volumes:
      - backend-upload:/app/upload
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./hansport_v2fe
      args:
        VITE_API_URL: ""
        VITE_BASE_URL: http://localhost:5173
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: hansport-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  mysql-data:
  backend-upload:
