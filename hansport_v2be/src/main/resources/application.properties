spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hansport_v2?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}

#default = 1MB
spring.servlet.multipart.max-file-size=50MB  

#default = 10 MB (form data)
spring.servlet.multipart.max-request-size=50MB


logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%5p pid=${PID:-} thread=%t logger=%logger{36} message=%m%n

#config jwt
hansport.jwt.base64-secret=${JWT_BASE64_SECRET}


hansport.jwt.access-token-validity-in-seconds=${JWT_ACCESS_TOKEN_VALIDITY:86400}
hansport.jwt.refreshtoken-validity-in-seconds=${JWT_REFRESH_TOKEN_VALIDITY:604800}

hansport.upload-file.base-path=${UPLOAD_FILE_BASE_PATH:../hansport_v2fe/upload}

#config oauth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

server.port=${SERVER_PORT:8080}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.cors.allow-localhost=${CORS_ALLOW_LOCALHOST:true}
app.cookie.secure=${COOKIE_SECURE:false}
app.seed.enabled=${SEED_ENABLED:true}
app.seed.required.enabled=${SEED_REQUIRED_ENABLED:${SEED_ENABLED:true}}
app.seed.admin.enabled=${SEED_ADMIN_ENABLED:false}
app.seed.admin.password=${SEED_ADMIN_PASSWORD:}
app.seed.settings.enabled=${SEED_SETTINGS_ENABLED:${SEED_ENABLED:true}}

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,info}
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Han Sports v2
info.app.description=Spring Boot REST API for Han Sports v2

##config email with GMAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
##thay email cua ban vao day
spring.mail.username=${YOUR_EMAIL}
##thay app password cua ban vao day
spring.mail.password=${YOUR_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
